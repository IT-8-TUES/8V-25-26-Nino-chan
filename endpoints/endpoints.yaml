openapi: 3.0.3
info:
  title: Events API
  version: 0.1.0

tags:
  - name: HOME
  - name: LOGIN
  - name: REGISTER
  - name: ARCHIVE
  - name: LONG DESCRIPTION
  - name: SEARCH PAGE
  - name: PROFILE
  - name: VERIFY
  - name: RECOMMENDATIONS

paths:

  /event/{id}:
    get:
      tags: [HOME, LONG DESCRIPTION]
      summary: HOME / LONG DESCRIPTION
      description: |
        normal

        Used by two pages:
        - HOME: path is a date (YYYY-MM-DD), returns events on that date as a list of {title, creator, id}.
        - LONG DESCRIPTION: path is an event ObjectId string, returns event detail
          {title, description, date, creator, creatorid}.
      parameters:
        - in: header
          name: jwt
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          description: date (YYYY-MM-DD) for HOME, event ObjectId string for LONG DESCRIPTION
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/EventSummary'
                  - $ref: '#/components/schemas/EventDetail'

  /user/login:
    post:
      operationId: login
      tags: [LOGIN]
      summary: LOGIN
      description: Public. Authenticates a user and returns a JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: user@example.com
              password: hunter2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                code: 200
                jwt: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyaWQiOjQyfQ.signature

  /user/register:
    post:
      operationId: register
      tags: [REGISTER]
      summary: REGISTER
      description: Public. Creates a new user account. New accounts cannot publish events until verified by an admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
            example:
              email: newuser@example.com
              password: hunter2
              username: newuser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code'
              example:
                code: 200

  /user/verify:
    post:
      operationId: verify
      tags: [VERIFY]
      summary: VERIFY
      description: |
        normal. Sends a verification request email to the admins so they can grant
        the user publishing rights. Requires the user to confirm their password.
      parameters:
        - in: header
          name: jwt
          required: true
          schema:
            type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyaWQiOjQyfQ.signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
            example:
              password: hunter2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code'
              example:
                code: 200

  /user:
    patch:
      tags: [PROFILE]
      summary: PROFILE - update profile
      description: normal. User is identified by JWT — no userid needed in body.
      parameters:
        - in: header
          name: jwt
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code'

  /user/{userid}:
    get:
      tags: [ARCHIVE, PROFILE]
      summary: ARCHIVE / PROFILE
      description: |
        normal

        Used by two pages, distinguished by the `mode` query parameter:
        - ARCHIVE (?mode=archive): returns the user's bookmarked upcoming events as {title, creator, id}.
        - PROFILE (?mode=profile): returns the user's public profile {email, username, bio}.
      parameters:
        - in: header
          name: jwt
          required: true
          schema:
            type: string
        - in: path
          name: userid
          required: true
          schema:
            type: string
        - in: query
          name: mode
          required: true
          schema:
            type: string
            enum: [archive, profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/EventSummary'
                  - $ref: '#/components/schemas/Profile'

    post:
      tags: [LONG DESCRIPTION]
      summary: LONG DESCRIPTION - mark/unmark event
      description: normal. Adds or removes the event from the authenticated user's bookmarks.
      parameters:
        - in: header
          name: jwt
          required: true
          schema:
            type: string
        - in: path
          name: userid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Participation'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code'

  /vibeSearch:
    get:
      tags: [RECOMMENDATIONS]
      summary: RECOMMENDATIONS - vibe search
      description: |
        normal. Returns the top 5 upcoming events most semantically similar to the
        given prompt. If no prompt is provided, uses the authenticated user's saved
        preference string instead. Similarity is computed via vector search on a
        768-dimensional `nomic-embed-text` embedding stored on each event.

        Requires a MongoDB Atlas `vector_index` on the `events.embedding` field.
      parameters:
        - in: header
          name: jwt
          required: true
          schema:
            type: string
        - in: query
          name: prompt
          required: false
          description: Free-text description of what you are looking for. Omit to use the user's saved preference.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSummary'
              example:
                - title: Science Fair
                  creator: teacher1
                  id: 664a1b2c3d4e5f6a7b8c9d0e

  /event:
    get:
      tags: [SEARCH PAGE]
      summary: SEARCH PAGE
      description: normal. Regex search on title and/or publisher username. Paginated with page_num (0-indexed).
      parameters:
        - in: header
          name: jwt
          required: true
          schema:
            type: string
        - in: query
          name: title
          schema:
            type: string
        - in: query
          name: user
          schema:
            type: string
        - in: query
          name: page_num
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'

    post:
      tags: [PROFILE]
      summary: PROFILE - create event
      description: Requires a verified account.
      parameters:
        - in: header
          name: jwt
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEvent'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code'

components:
  schemas:

    Code:
      type: object
      properties:
        code:
          type: integer

    Credentials:
      type: object
      properties:
        email:
          type: string
        password:
          type: string

    RegisterBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        username:
          type: string

    LoginResponse:
      type: object
      properties:
        code:
          type: integer
        jwt:
          type: string

    VerifyRequest:
      type: object
      properties:
        password:
          type: string

    EventSummary:
      type: object
      properties:
        title:
          type: string
        creator:
          type: string
        id:
          type: string

    EventDetail:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        date:
          type: string
        creator:
          type: string
        creatorid:
          type: string

    SearchResult:
      type: object
      properties:
        date:
          type: string
        title:
          type: string
        eventid:
          type: string
        creatorid:
          type: string
        creator:
          type: string

    Profile:
      type: object
      properties:
        email:
          type: string
        username:
          type: string
        bio:
          type: string

    ProfilePatch:
      type: object
      properties:
        email:
          type: string
        username:
          type: string
        bio:
          type: string
        preference:
          type: string
          description: Free-text preference string used as the default vibe-search query when no prompt is supplied.

    Participation:
      type: object
      properties:
        eventid:
          type: string
        participating:
          type: boolean

    NewEvent:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        date:
          type: string
