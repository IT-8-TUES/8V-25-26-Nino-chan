services:

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
      - ./docker/ollama-init.sh:/ollama-init.sh
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /ollama-init.sh | /bin/sh"]
    healthcheck:
      # Healthy only once the model is actually pulled
      test: ["CMD-SHELL", "ollama list | grep -q mxbai-embed-large"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB:-tues_calendar}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  pics:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5001:5001"
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB:-tues_calendar}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    volumes:
      - ./backend/uploads/profile-pics:/app/uploads/profile-pics
    entrypoint: ["python", "pics_app/app.py"]
    depends_on:
      - backend
