<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalTUES — Home</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
    <header>
        <h1>CalTUES</h1>
        <nav>
            <a href="./home.html" class="active">Home</a>
            <a href="../../Philip/search.html">Search</a>
            <a href="../../Marti/html/archive.html">Archive</a>
            <a href="../../Philip/profile.html">Profile</a>
        </nav>
    </header>

    <div class="home-container">
        <div class="calendar-header">
            <button class="cal-nav" id="prev-month" aria-label="Previous month">&lsaquo;</button>
            <h2 id="month-label"></h2>
            <button class="cal-nav" id="next-month" aria-label="Next month">&rsaquo;</button>
        </div>

        <div class="calendar-grid" id="calendar-grid"></div>

        <div class="day-events">
            <h3 id="selected-day-label">Pick a date</h3>
            <p class="subtitle">Click any day above to see the events for that date.</p>
            <div id="event-list"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 CalTUES &middot; TUES</p>
    </footer>

    <script src="../javascript/home.js"></script>
</body>
</html>
