<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalTUES</title>
    <link rel="stylesheet" href="./static/styles.css">
</head>
<body>
    <header>
        <h1>CalTUES</h1>
    </header>
    <div class="register-container">
        <div class="register-body">
            <h2>Login</h2>
            <p>Нямаш акаунт? <a href="../../Kristian/templates/register.html">Register</a></p>
            <form id="loginForm">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@elsys-bg.org" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <input type="submit" value="Login">
            </form>
            <div id="message"></div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');
            message.textContent = '';

            try {
                const response = await fetch('/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok && data.jwt) {
                    localStorage.setItem('jwt', data.jwt);
                    const payload = JSON.parse(atob(data.jwt.split('.')[1]));
                    localStorage.setItem('user_id', payload.user_id);
                    window.location.href = '../../Nikola/index.html';
                } else {
                    message.textContent = data.message || 'Invalid email or password.';
                }
            } catch {
                message.textContent = 'Could not connect to the server.';
            }
        });
    </script>
</body>
</html>
